services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
      POSTGRES_DB: hms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/init_test_db.sh:/docker-entrypoint-initdb.d/02-init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hms:hms@postgres:5432/hms
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # No inline JSON default here: docker-compose's ${VAR:-default} parsing
      # stops at the first closing brace, so a literal {"k1":"..."} default
      # would truncate. Require it instead (set it in .env, see .env.example).
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?set a JSON JWT signing keyring, see .env.example}
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-k1}
      # Required, not soft-defaulted: HMAC_KEY indexes PHI (phone/national-id
      # dedup hashes) — a known default would let anyone dictionary-attack
      # those columns. See REVIEW-AGENT finding M2, PRPs/auth-rbac-abac-prp.md.
      HMAC_KEY: ${HMAC_KEY:?set a separate HMAC key, see .env.example}
      LOGIN_IP_RATE_LIMIT_PER_MINUTE: ${LOGIN_IP_RATE_LIMIT_PER_MINUTE:-20}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?set a 32-byte urlsafe base64 Fernet key}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification_worker:
    build: ./backend
    command: ["python", "-m", "app.workers.notification_consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg2://hms:hms@postgres:5432/hms
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?set a JSON JWT signing keyring, see .env.example}
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-k1}
      HMAC_KEY: ${HMAC_KEY:?set a separate HMAC key, see .env.example}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?set a 32-byte urlsafe base64 Fernet key}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  queue_wait_time_worker:
    build: ./backend
    command: ["python", "-m", "app.workers.queue_wait_time_consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg2://hms:hms@postgres:5432/hms
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?set a JSON JWT signing keyring, see .env.example}
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-k1}
      HMAC_KEY: ${HMAC_KEY:?set a separate HMAC key, see .env.example}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:?set a 32-byte urlsafe base64 Fernet key}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
