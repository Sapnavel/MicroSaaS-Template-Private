server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side) routing: any path that doesn't match a real
    # static file falls back to index.html so the SPA's own router can handle
    # it -- without this, a direct navigation or refresh on any route other
    # than "/" (e.g. /login, /dashboard/executive) 404s at nginx before React
    # ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
