server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (client-side) routing: any path that doesn't match a real
    # static file falls back to index.html so the SPA's own router can handle
    # it -- without this, a direct navigation or refresh on any route other
    # than "/" (e.g. /login, /dashboard/executive) 404s at nginx before React
    # ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints every file under /assets/ with a content hash in its
    # filename (index-<hash>.js/.css), so it's always safe to cache those
    # aggressively -- a new build never reuses an old filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html itself is NOT fingerprinted and is what references the
    # current /assets/ filenames, so it must never be cached -- a stale
    # cached index.html after a rebuild silently keeps serving old JS/CSS
    # (this bit us twice this session: a rebuilt container kept showing
    # pre-rebuild pages until a manual hard-refresh bypassed the browser's
    # default heuristic caching).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
